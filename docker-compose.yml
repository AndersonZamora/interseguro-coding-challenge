services:
  node-api:
    build: ./node-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DEMO_CLIENT_ID=${DEMO_CLIENT_ID}
      - DEMO_CLIENT_SECRET=${DEMO_CLIENT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  go-api:
    build: ./go-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - NODE_API_URL=http://node-api:3000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    depends_on:
      node-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - go-api
      - node-api
